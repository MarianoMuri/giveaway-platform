services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sorteos
      POSTGRES_PASSWORD: sorteos
      POSTGRES_DB: sorteos
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: development # local: no exige la configuración completa de producción
    command: sh -c "npm run migrate && node src/server.js"
    ports:
      - "4000:4000"
    depends_on:
      - db
volumes:
  pgdata:
